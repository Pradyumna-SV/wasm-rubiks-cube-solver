[package]
name = "rubiks_cube"
version = "0.1.0"
edition = "2021"
description = "A hyper-fast, symmetry-reduced 2-Phase Rubik's Cube Solver in Rust, optimized for both native and WebAssembly."
license = "MIT"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "solver"
path = "src/main.rs"

[dependencies]
rayon = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
