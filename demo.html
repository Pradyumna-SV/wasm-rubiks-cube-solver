<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyper-Fast Rubik's Cube WASM Solver</title>
    <!-- Modern Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: rgba(22, 24, 33, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary-glow: #3b82f6;
            --accent-glow: #10b981;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.05) 0%, transparent 40%);
        }

        .container {
            max-width: 700px;
            width: 90%;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #60a5fa 0%, #34d399 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: -0.03em;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 300;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 30px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            border-color: rgba(96, 165, 250, 0.2);
            box-shadow: 0 20px 40px rgba(59, 130, 246, 0.05);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 600;
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            margin-bottom: 24px;
            border: 1px solid rgba(239, 68, 68, 0.15);
            transition: all 0.3s ease;
        }

        .status-badge.loaded {
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            border-color: rgba(16, 185, 129, 0.15);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: currentColor;
            box-shadow: 0 0 8px currentColor;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            gap: 12px;
        }

        input[type="text"] {
            flex-grow: 1;
            background: rgba(13, 14, 18, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px 20px;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--primary-glow);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.15);
            background: rgba(13, 14, 18, 0.9);
        }

        button {
            cursor: pointer;
            padding: 16px 28px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .result-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid var(--border-color);
            display: none;
        }

        .result-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .solution-box {
            background: rgba(13, 14, 18, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.4rem;
            color: #34d399;
            text-shadow: 0 0 10px rgba(52, 211, 153, 0.2);
            word-break: break-all;
            line-height: 1.6;
            margin-bottom: 16px;
            letter-spacing: 0.05em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .error-message {
            color: #f87171;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.15);
            border-radius: 12px;
            padding: 16px;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Rubik's Cube WASM Solver</h1>
            <p>Symmetry-reduced 2-phase engine running in WebAssembly</p>
        </div>

        <div class="card">
            <div id="statusBadge" class="status-badge">
                <span class="status-dot"></span>
                <span id="statusText">Loading WebAssembly...</span>
            </div>

            <div class="input-group">
                <label for="scrambleInput">Enter Scramble</label>
                <div class="input-wrapper">
                    <input type="text" id="scrambleInput" placeholder="e.g., R U R' U' F' U2 F" disabled>
                </div>
            </div>

            <div class="actions">
                <button id="solveBtn" class="btn-primary" disabled>
                    <span>Solve Scramble</span>
                </button>
                <button id="randomBtn" class="btn-secondary" disabled>
                    <span>Random Scramble</span>
                </button>
            </div>

            <div id="errorMessage" class="error-message"></div>

            <div id="resultSection" class="result-section">
                <div class="result-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    <span>Solution Found</span>
                </div>
                <div id="solutionBox" class="solution-box"></div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Move Count</div>
                        <div id="moveCountStat" class="stat-value">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Execution Time</div>
                        <div id="timeStat" class="stat-value">-</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- WASM loading scripts -->
    <script type="module">
        import init, { WasmSolver } from './pkg/rubiks_cube.js';

        let solver = null;
        const statusBadge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');
        const scrambleInput = document.getElementById('scrambleInput');
        const solveBtn = document.getElementById('solveBtn');
        const randomBtn = document.getElementById('randomBtn');
        const resultSection = document.getElementById('resultSection');
        const solutionBox = document.getElementById('solutionBox');
        const moveCountStat = document.getElementById('moveCountStat');
        const timeStat = document.getElementById('timeStat');
        const errorMessage = document.getElementById('errorMessage');

        // Standard Rubik's moves for generating random scrambles
        const MOVES = [
            'U', "U'", 'U2', 'D', "D'", 'D2',
            'F', "F'", 'F2', 'B', "B'", 'B2',
            'L', "L'", 'L2', 'R', "R'", 'R2'
        ];

        function generateRandomScramble(len = 25) {
            let scramble = [];
            let lastFace = -1;
            for (let i = 0; i < len; i++) {
                let moveIdx;
                let face;
                do {
                    moveIdx = Math.floor(Math.random() * MOVES.length);
                    face = Math.floor(moveIdx / 3);
                } while (face === lastFace);
                scramble.push(MOVES[moveIdx]);
                lastFace = face;
            }
            return scramble.join(' ');
        }

        async function start() {
            try {
                // Initialize WASM module loader
                await init();
                
                statusText.innerText = "Initializing Solver Tables...";
                
                // Yield to browser UI thread to render progress before heavy include_bytes! init
                await new Promise(resolve => setTimeout(resolve, 50));
                
                const t0 = performance.now();
                solver = WasmSolver.new_embedded();
                const initTime = performance.now() - t0;
                
                statusBadge.classList.add('loaded');
                statusText.innerText = `Ready (Loaded in ${initTime.toFixed(0)}ms)`;
                
                // Enable UI elements
                scrambleInput.disabled = false;
                solveBtn.disabled = false;
                randomBtn.disabled = false;
            } catch (err) {
                console.error("WASM Load Error:", err);
                statusText.innerText = "Initialization Failed!";
                errorMessage.innerText = "Error: " + err.toString() + "\nMake sure you have run the build using `wasm-pack build --target web` first.";
                errorMessage.style.display = "block";
            }
        }

        // Handle solving
        solveBtn.addEventListener('click', () => {
            const scramble = scrambleInput.value.trim();
            errorMessage.style.display = "none";
            resultSection.style.display = "none";

            if (!scramble) return;

            const t0 = performance.now();
            const solution = solver.solve(scramble);
            const duration = performance.now() - t0;

            if (solution === null || solution === undefined) {
                errorMessage.innerText = "Invalid scramble! Please verify all moves are valid (e.g. U, R, F2, L').";
                errorMessage.style.display = "block";
            } else {
                solutionBox.innerText = solution || "Solved (0 moves)";
                const moves = solution ? solution.split(' ').length : 0;
                moveCountStat.innerText = `${moves} moves`;
                timeStat.innerText = `${duration.toFixed(2)} ms`;
                resultSection.style.display = "block";
            }
        });

        // Handle random scramble generation
        randomBtn.addEventListener('click', () => {
            scrambleInput.value = generateRandomScramble(25);
            resultSection.style.display = "none";
            errorMessage.style.display = "none";
        });

        // Trigger start
        start();
    </script>
</body>
</html>
